optimizer:
  type: AdamW
  kwargs:
    lr: 0.0001
    weight_decay: 0.0005
scheduler:
  type: LambdaLR
  kwargs:
    decay_step: 21
    lr_decay: 0.9
    lowest_decay: 0.02
bnmscheduler:
  type: Lambda
  kwargs:
    decay_step: 21
    bn_decay: 0.5
    bn_momentum: 0.9
    lowest_decay: 0.01
dataset:
  train:
    _base_: cfgs/dataset_configs/SkullBreak.yaml
    others:
      DATA_ROOT: data/SkullBreakPC_out8192
      subset: train
      split_field: official_split
      manifest_split: train
      exclude_split_field: monitor_split
      exclude_manifest_split: monitor
      include_case_ids_file: logs/skullbreak_mamba_v12_development/protocol_v1/foldB_train_case_ids.txt
      input_key: partial
      target_key: implant
      N_PARTIAL: 8192
      N_POINTS: 8192
  val:
    _base_: cfgs/dataset_configs/SkullBreak.yaml
    others:
      DATA_ROOT: data/SkullBreakPC_out8192
      subset: val
      split_field: official_split
      manifest_split: train
      exclude_split_field: monitor_split
      exclude_manifest_split: monitor
      include_case_ids_file: logs/skullbreak_mamba_v12_development/protocol_v1/foldB_dev_case_ids.txt
      input_key: partial
      target_key: implant
      N_PARTIAL: 8192
      N_POINTS: 8192
  test:
    _base_: cfgs/dataset_configs/SkullBreak.yaml
    others:
      DATA_ROOT: data/SkullBreakPC_out8192
      subset: test
      split_field: official_split
      manifest_split: train
      exclude_split_field: monitor_split
      exclude_manifest_split: monitor
      include_case_ids_file: logs/skullbreak_mamba_v12_development/protocol_v1/foldB_dev_case_ids.txt
      input_key: partial
      target_key: implant
      N_PARTIAL: 8192
      N_POINTS: 8192
model:
  NAME: AdaPoinTr
  num_query: 256
  num_points: 8192
  center_num:
  - 512
  - 256
  global_feature_dim: 1024
  encoder_type: graph
  decoder_type: fc
  query_selection: learned_only
  denoise_weight: 0.0
  fine_coverage_weight: 1.0
  fine_local_weight: 0.0
  encoder_config:
    embed_dim: 384
    depth: 6
    num_heads: 6
    k: 8
    n_group: 2
    mlp_ratio: 2.0
    block_style_list:
    - attn-graph
    - attn
    - attn
    - attn
    - attn
    - attn
    combine_style: concat
  decoder_config:
    embed_dim: 384
    depth: 8
    num_heads: 6
    k: 8
    n_group: 2
    mlp_ratio: 2.0
    self_attn_block_style_list:
    - attn-graph
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    self_attn_combine_style: concat
    cross_attn_block_style_list:
    - attn-graph
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    - attn
    cross_attn_combine_style: concat
  mamba_adapter:
    enabled: false
  coarse_geometry_guard:
    enabled: false
    mode: none
    weight: 0.0
  local_rim_guard:
    enabled: false
    trust_enabled: false
  dense_contact_objective:
    enabled: false
    weight: 0.0
  rim_query_allocation:
    enabled: false
    classification_weight: 0.0
  cranial_scqr:
    variant: B0
    enabled: false
    local_geometry_enabled: false
    contact_supervision_enabled: false
    query_conditioning_enabled: false
    contact_bias_beta: 0.0
    local_knn_small: 16
    local_knn_large: 32
    attention_dim: 128
    warmup_epochs: 20
    rim_band_mm: 2.0
    alpha_local_init: 0.01
    alpha_query_init: 0.01
    attention_dropout: 0.0
    probability_floor: 0.0001
    initialization_seed: 31001
    auxiliary_loss_weight: null
total_bs: 8
step_per_update: 1
max_epoch: 100
consider_metric: CDL2
save_freq: 10
save_best_checkpoint: false
save_final_epoch_checkpoints: false
cranial_scqr_execution:
  stage: L1_static_template
  status: training_locked_pending_L2_L3_and_calibration
  training_authorized: false
  optimizer_steps_authorized: 0
  bncal_authorized: false
  formal_timing_authorized: false
development_protocol:
  name: cranial-scqr-v1.1
  candidate: B0
  fold: B
  round: A
  seed: 0
  development84_reused: true
  protected_splits_accessed: false
  confirmation_allowed: false
  old_monitor_allowed: false
  official_test_allowed: false
  mug_payload_allowed: false
