optimizer: {
  type: AdamW,
  kwargs: {lr: 0.0001, weight_decay: 0.0005}
}

scheduler: {
  type: LambdaLR,
  kwargs: {decay_step: 21, lr_decay: 0.9, lowest_decay: 0.02}
}

bnmscheduler: {
  type: Lambda,
  kwargs: {
    decay_step: 21, bn_decay: 0.5, bn_momentum: 0.9,
    lowest_decay: 0.01
  }
}

dataset: {
  train: {
    _base_: cfgs/dataset_configs/SkullBreak.yaml,
    others: {
      subset: train, split_field: gate_split, manifest_split: train,
      max_skulls: 8, input_key: partial, target_key: implant,
      N_PARTIAL: 8192, N_POINTS: 4096
    }},
  val: {
    _base_: cfgs/dataset_configs/SkullBreak.yaml,
    others: {
      subset: val, split_field: gate_split, manifest_split: val,
      max_skulls: 2, input_key: partial, target_key: implant,
      N_PARTIAL: 8192, N_POINTS: 4096
    }},
  test: {
    _base_: cfgs/dataset_configs/SkullBreak.yaml,
    others: {
      subset: test, split_field: gate_split, manifest_split: test,
      max_skulls: 2, input_key: partial, target_key: implant,
      N_PARTIAL: 8192, N_POINTS: 4096
    }}
}

model: {
  NAME: AdaPoinTr,
  num_query: 256,
  num_points: 4096,
  center_num: [512, 256],
  global_feature_dim: 1024,
  encoder_type: graph,
  decoder_type: fc,
  query_selection: learned_only,
  denoise_weight: 0.0,
  fine_coverage_weight: 1.0,
  fine_local_weight: 0.0,
  encoder_config: {
    embed_dim: 384, depth: 6, num_heads: 6, k: 8, n_group: 2,
    mlp_ratio: 2.0,
    block_style_list: [attn-graph, attn, attn, attn, attn, attn],
    combine_style: concat,
  },
  decoder_config: {
    embed_dim: 384, depth: 8, num_heads: 6, k: 8, n_group: 2,
    mlp_ratio: 2.0,
    self_attn_block_style_list: [
      attn-graph, attn, attn, attn, attn, attn, attn, attn
    ],
    self_attn_combine_style: concat,
    cross_attn_block_style_list: [
      attn-graph, attn, attn, attn, attn, attn, attn, attn
    ],
    cross_attn_combine_style: concat,
  }
}

total_bs: 4
step_per_update: 1
max_epoch: 75
consider_metric: CDL2
save_freq: 75
save_final_epoch_checkpoints: false
