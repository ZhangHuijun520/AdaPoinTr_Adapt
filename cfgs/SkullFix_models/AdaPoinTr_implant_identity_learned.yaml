optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.00005,
    weight_decay: 0.0
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
    decay_step: 40,
    lr_decay: 0.9,
    lowest_decay: 0.1
}}

bnmscheduler: {
  type: Lambda,
  kwargs: {
    decay_step: 40,
    bn_decay: 0.5,
    bn_momentum: 0.9,
    lowest_decay: 0.01
}}

dataset: {
  train: {
    _base_: cfgs/dataset_configs/SkullFix.yaml,
    others: {
      subset: train, manifest_split: train, max_samples: 1,
      repeat: 8, input_key: implant, target_key: implant,
      N_PARTIAL: 4096, N_POINTS: 4096
    }},
  val: {
    _base_: cfgs/dataset_configs/SkullFix.yaml,
    others: {
      subset: val, manifest_split: train, max_samples: 1,
      input_key: implant, target_key: implant,
      N_PARTIAL: 4096, N_POINTS: 4096
    }},
  test: {
    _base_: cfgs/dataset_configs/SkullFix.yaml,
    others: {
      subset: test, manifest_split: train, max_samples: 1,
      input_key: implant, target_key: implant,
      N_PARTIAL: 4096, N_POINTS: 4096
    }}
}

model: {
  NAME: AdaPoinTr,
  num_query: 256,
  num_points: 4096,
  center_num: [512, 256],
  global_feature_dim: 1024,
  encoder_type: graph,
  decoder_type: fc,
  query_selection: learned_only,
  denoise_weight: 0.0,
  fine_coverage_weight: 1.0,
  fine_local_weight: 0.0,
  encoder_config: {
    embed_dim: 384,
    depth: 6,
    num_heads: 6,
    k: 8,
    n_group: 2,
    mlp_ratio: 2.0,
    block_style_list: [attn-graph, attn, attn, attn, attn, attn],
    combine_style: concat,
  },
  decoder_config: {
    embed_dim: 384,
    depth: 8,
    num_heads: 6,
    k: 8,
    n_group: 2,
    mlp_ratio: 2.0,
    self_attn_block_style_list: [attn-graph, attn, attn, attn, attn, attn, attn, attn],
    self_attn_combine_style: concat,
    cross_attn_block_style_list: [attn-graph, attn, attn, attn, attn, attn, attn, attn],
    cross_attn_combine_style: concat,
  }
}

total_bs: 8
step_per_update: 1
max_epoch: 300
consider_metric: CDL2
